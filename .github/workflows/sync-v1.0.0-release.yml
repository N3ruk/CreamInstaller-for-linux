name: Sync v1.0.0 release description

on:
  push:
    branches:
      - release-assets
    paths:
      - ".github/workflows/sync-v1.0.0-release.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.0 \
            --title "CreamLinux v1.0.0" \
            --notes-file RELEASE_NOTES.md
