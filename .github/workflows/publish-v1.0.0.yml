name: Publish v1.0.0

on:
  push:
    branches:
      - release-assets

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 && gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 \
            --target main \
            --title "CreamLinux v1.0.0" \
            --notes-file RELEASE_NOTES.md
